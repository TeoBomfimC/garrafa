{% extends "base.html" %}
{% block content %}

<h2>Registros de Auditoria</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>Usuário</th>
        <th>Ação</th>
        <th>Data</th>
    </tr>

    {% for log in registros %}
    <tr>
        <td>{{ log.usuario }}</td>
        <td>{{ log.acao }}</td>
        <td>{{ log.data }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">Nenhum registro encontrado.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
