{% extends "base.html" %}
{% block content %}

<h2>Eventos</h2>

{% if user.is_authenticated and user.perfil in "organizador admin" %}
<a href="{% url 'criar_evento' %}" class="btn btn-primary">Criar novo evento</a>
{% endif %}

<ul>
    {% for evento in eventos %}
        <li>
            <a href="{% url 'detalhe_evento' evento.id %}">{{ evento.titulo }}</a>
            ({{ evento.tipo }})
        </li>
    {% endfor %}
</ul>

{% endblock %}
