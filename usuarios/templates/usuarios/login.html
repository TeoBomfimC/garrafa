{% extends "base.html" %}
{% block content %}

<h2>Login</h2>

{% if form.errors %}
<p style="color: red;">Nome de usuário ou senha incorretos. Tente novamente.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
</form>

<p>Não tem uma conta?
    <a href="{% url 'registrar' %}">Cadastre-se</a>
</p>

{% endblock %}
